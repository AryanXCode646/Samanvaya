name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.0,<3.0"
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Import smoke test
        run: python -c "from lunar_core.data_io.mission_catalog import inspect_product; from lunar_core.data_io.pair_selector import propose_pair; print('imports ok')"
      - name: Run tests
        run: python -m pytest tests/ -q
