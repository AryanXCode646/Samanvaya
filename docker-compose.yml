# docker-compose.yml
# Samanvaya Containerized Portal Stack
# ISRO Chandrayaan-2 Planetary Remote Sensing Correspondence Framework (SIH PS 26166)

services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile
    image: samanvaya/portal:latest
    container_name: samanvaya-portal
    restart: unless-stopped
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    networks:
      - samanvaya-net
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    environment:
      - ENVIRONMENT=production

networks:
  samanvaya-net:
    driver: bridge
