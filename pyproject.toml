[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "samanvaya"
version = "0.3.0"
description = "Research-oriented lunar image correspondence and registration framework for Chandrayaan-2 and reference planetary imagery"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Ashish Singh Bora", email = "mr.ashishsinghbora@gmail.com" }
]
dependencies = [
    "torch>=2.0.0,<3.0.0",
    "kornia>=0.7.0,<0.9.0",
    "opencv-contrib-python-headless>=4.8.0,<5.1.0",
    "rasterio>=1.3.0,<1.6.0",
    "scipy>=1.10.0,<2.0.0",
    "scikit-image>=0.21.0,<0.27.0",
    "streamlit>=1.30.0,<2.0.0",
    "numpy>=1.24.0,<3.0.0",
    "matplotlib>=3.7.0,<4.0.0",
    "defusedxml>=0.7.1,<1.0.0",
    "reportlab>=4.0.0,<5.0.0",
    "tifffile>=2023.7.0,<2026.0.0"
]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "httpx>=0.24,<0.29",
    "fastapi>=0.100,<0.116"
]

[project.scripts]
samanvaya = "lunar_core.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lunar_core*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "real_data: requires locally supplied mission products and skips when unavailable",
]

