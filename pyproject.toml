[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "samanvaya"
version = "1.0.0"
description = "Samanvaya: Multi-Modal, Sun Angle & Scale Invariant Lunar Registration Engine (Chandrayaan-2 OHRC, TMC-2, IIRS)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Ashish Singh Bora", email = "mr.ashishsinghbora@gmail.com" }
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "opencv-contrib-python>=4.8",
    "rasterio>=1.3",
    "torch>=2.0",
    "kornia>=0.7",
    "pydantic>=2.0",
    "fastapi>=0.100",
    "uvicorn>=0.22",
    "streamlit>=1.25",
    "matplotlib>=3.7",
    "tifffile>=2023.7",
    "defusedxml>=0.7.1"
]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "httpx>=0.24"
]

[project.scripts]
samanvaya = "lunar_core.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lunar_core*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

